# Produção em VPS: API pessoal + catálogo atrás de um gateway Nginx, com HTTPS pelo Caddy.
# Uso (nesta pasta): docker compose up -d --build
name: books

x-hardening: &hardening
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  api:
    <<: *hardening
    image: books-api:local
    build:
      context: ../../apps/server
      args:
        NODE_IMAGE: ${NODE_IMAGE:?Defina NODE_IMAGE no .env}
    init: true
    env_file:
      - path: ./api.env
        format: raw
    environment:
      DATABASE_PATH: /data/reading-log.db
      PORT: "8080"
    ports:
      - 127.0.0.1:8086:8080
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  catalog:
    <<: *hardening
    image: books-api:local
    entrypoint: ["node", "src/catalog/main.js"]
    command: []
    init: true
    read_only: true
    env_file:
      - path: ./catalog.env
        format: raw
    environment:
      PORT: "8080"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  gateway:
    <<: *hardening
    image: ${GATEWAY_IMAGE:?Defina GATEWAY_IMAGE no .env}
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    ports:
      - 127.0.0.1:8087:8080
    volumes:
      - type: bind
        source: ./gateway.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      api:
        condition: service_healthy
      catalog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  caddy:
    <<: *hardening
    image: ${CADDY_IMAGE:?Defina CADDY_IMAGE no .env}
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Defina PUBLIC_DOMAIN no .env}
    ports:
      - ${PUBLIC_IP:-0.0.0.0}:80:80
      - ${PUBLIC_IP:-0.0.0.0}:443:443
      - ${PUBLIC_IP:-0.0.0.0}:443:443/udp
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - ./caddy/data:/data
      - ./caddy/config:/config
    depends_on:
      gateway:
        condition: service_healthy
