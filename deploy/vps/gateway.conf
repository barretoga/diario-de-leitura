# Um limite global para o catálogo: atrás do proxy, o IP do cliente não identifica a pessoa.
limit_req_zone $server_name zone=books_catalog:1m rate=30r/m;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log off;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ^~ /v1/catalog/ {
        limit_req zone=books_catalog burst=10 nodelay;
        limit_req_status 429;
        error_log /dev/null;
        set $catalog_backend catalog:8080;
        proxy_pass http://$catalog_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For "";
        proxy_read_timeout 20s;
    }

    location / {
        set $sync_backend api:8080;
        proxy_pass http://$sync_backend$request_uri;
        proxy_set_header Host $host;
        proxy_read_timeout 20s;
    }
}
