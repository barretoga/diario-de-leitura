services:
  catalog:
    build: ./apps/server
    command: ["node", "src/catalog/main.js"]
    restart: unless-stopped
    init: true
    environment:
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:?Defina GOOGLE_BOOKS_API_KEY somente no servidor}
      CATALOG_CONTACT_EMAIL: ${CATALOG_CONTACT_EMAIL:?Defina CATALOG_CONTACT_EMAIL para identificar consultas}
      PORT: 8080
    ports:
      - "127.0.0.1:${CATALOG_PORT:-8081}:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
